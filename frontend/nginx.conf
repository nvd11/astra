server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 启用 Gzip 深度压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 静态静态资源长缓存
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # /astra 301 重定向至 /astra/
    location = /astra {
        return 301 /astra/;
    }

    # SPA 路由 /astra/
    location /astra/ {
        try_files $uri $uri/ /astra/index.html;
    }

    # 根路由及任意前缀回退
    location / {
        try_files $uri $uri/ /astra/index.html;
    }

    # 简易探活路由
    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
